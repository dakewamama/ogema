[package]
name    = "geyser-watcher"
edition = "2021"
version = "0.1.0"

[[bin]]
name = "geyser-watcher"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
futures = "0.3"
bs58 = "0.5"
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
yellowstone-grpc-client = "12"
yellowstone-grpc-proto = "12"
rustls = { version = "0.23", features = ["ring"] }

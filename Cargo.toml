[package]
name = "ogema"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "searcher"
path = "src/main.rs"

[dependencies]
solana-sdk = "1.18"
solana-client = "1.18"
solana-rpc-client = "1.18"
jito-sdk-rust = "0.3.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
bs58 = "0.5"
bincode = "1"
dotenv = "0.15"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
regex = "1.12.4"
